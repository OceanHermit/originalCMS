<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ブロック編集 | ページビルダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
:root{
  --bg-app:#15171c; --bg-panel:#1b1e25; --bg-panel-2:#20232c; --border:#2b2f39;
  --text:#f2f1ed; --text-muted:#90939f; --accent:#6c5ce7; --accent-soft:rgba(108,92,231,.18);
  --sans:'Inter','Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:var(--sans);background:var(--bg-app);color:var(--text);overflow:hidden;}
button,select,input,textarea{font-family:inherit;}
#app{display:flex;flex-direction:column;height:100vh;}

.topbar{
  height:56px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;background:var(--bg-panel);border-bottom:1px solid var(--border);gap:8px;
}
.brand{font-weight:700;display:flex;align-items:center;gap:8px;font-size:14px;flex:0 0 auto;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
.topbar-actions{display:flex;gap:6px;align-items:center;}
.btn{
  background:var(--bg-panel-2);color:var(--text);border:1px solid var(--border);
  padding:8px 13px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--accent);}
.btn:disabled{opacity:.4;cursor:default;}
.btn:disabled:hover{border-color:var(--border);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.btn-primary:hover{filter:brightness(1.1);}
.btn svg{width:16px;height:16px;}
.icon-btn{
  background:var(--bg-panel-2);color:var(--text);border:1px solid var(--border);
  width:34px;height:34px;padding:0;border-radius:8px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
}
.icon-btn svg{width:17px;height:17px;}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.icon-btn:disabled{opacity:.35;cursor:default;}
.icon-btn:disabled:hover{border-color:var(--border);color:var(--text);}
.tb-sep{width:1px;height:22px;background:var(--border);margin:0 3px;}
#status{font-size:11px;color:var(--text-muted);opacity:0;transition:opacity .3s;white-space:nowrap;}
.account{font-size:12px;color:var(--text-muted);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.workspace{flex:1;display:flex;min-height:0;}
.rail{
  width:250px;flex:0 0 auto;background:var(--bg-panel);border-right:1px solid var(--border);
  overflow-y:auto;display:flex;flex-direction:column;
}
.inspector{
  width:290px;flex:0 0 auto;background:var(--bg-panel);border-left:1px solid var(--border);
  overflow-y:auto;padding:14px;
}
.sec{padding:14px;border-bottom:1px solid var(--border);}
.sec h4{
  font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);
  margin:0 0 10px;font-weight:600;display:flex;align-items:center;justify-content:space-between;
}
.stage-wrap{flex:1;background:#3a3d46;display:flex;flex-direction:column;min-width:0;}
.stage-bar{
  height:38px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--bg-panel-2);border-bottom:1px solid var(--border);
}
.seg{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
.seg button{
  background:var(--bg-panel);color:var(--text-muted);border:none;padding:5px 12px;
  font-size:12px;cursor:pointer;border-right:1px solid var(--border);
}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--accent);color:#fff;}
#stageHost{flex:1;overflow:auto;display:flex;justify-content:center;padding:16px;}
#stage{
  background:#fff;border:none;box-shadow:0 10px 40px rgba(0,0,0,.4);flex:0 0 auto;
  width:100%;max-width:1200px;height:100%;transition:max-width .2s;
}
#stage.w-sp{max-width:420px;}
#stage.w-tab{max-width:820px;}

/* Block list */
#blockList{display:flex;flex-direction:column;gap:3px;}
.blk-item{
  display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:7px;font-size:12.5px;
  cursor:pointer;color:var(--text-muted);border:1px solid transparent;
}
.blk-item:hover{background:var(--bg-panel-2);}
.blk-item.active{background:var(--accent-soft);color:var(--text);border-color:var(--accent);}
.blk-item.is-hidden .blk-name{opacity:.4;text-decoration:line-through;}
.blk-item .blk-ic{flex:0 0 auto;opacity:.8;display:flex;}
.blk-item .blk-ic svg{width:15px;height:15px;}
.blk-item .blk-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.blk-item .blk-tog{
  flex:0 0 auto;opacity:0;background:none;border:none;color:var(--text-muted);cursor:pointer;
  padding:2px;border-radius:4px;display:flex;
}
.blk-item .blk-tog svg{width:14px;height:14px;}
.blk-item:hover .blk-tog{opacity:.85;}
.blk-item .blk-tog:hover{color:var(--accent);}
.blk-item.dragging{opacity:.4;}
.blk-item.drop-before{box-shadow:0 -2px 0 0 var(--accent);}
.blk-item.drop-after{box-shadow:0 2px 0 0 var(--accent);}
.blk-item .grip{opacity:.3;cursor:grab;display:flex;flex:0 0 auto;}
.blk-item .grip svg{width:13px;height:13px;}
.blk-item:hover .grip{opacity:.75;}

#pageList{display:flex;flex-direction:column;gap:3px;}
.pg-item{
  display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:7px;font-size:12.5px;
  cursor:pointer;color:var(--text-muted);border:1px solid transparent;
}
.pg-item:hover{background:var(--bg-panel-2);}
.pg-item.active{background:var(--accent-soft);color:var(--text);border-color:var(--accent);}
.pg-item .pg-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pg-item .pg-file{font-size:10px;opacity:.6;flex:0 0 auto;}
.pg-item .blk-tog{opacity:0;}
.pg-item:hover .blk-tog{opacity:.85;}
#colorList{display:flex;flex-wrap:wrap;gap:6px;}
.sw{
  width:30px;height:30px;border-radius:6px;border:1px solid rgba(255,255,255,.2);
  cursor:pointer;padding:0;position:relative;
}
.sw:hover{outline:2px solid var(--accent);outline-offset:1px;}
.sw span{
  position:absolute;bottom:-2px;right:-2px;font-size:8px;background:var(--bg-panel);
  border-radius:3px;padding:0 2px;color:var(--text-muted);
}
.empty{color:var(--text-muted);font-size:12.5px;line-height:1.9;text-align:center;padding:26px 14px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:10.5px;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;}
.field input[type=text],.field textarea,.field select{
  width:100%;background:var(--bg-panel-2);border:1px solid var(--border);color:var(--text);
  padding:7px 9px;border-radius:6px;font-size:12.5px;
}
.field textarea{min-height:64px;resize:vertical;line-height:1.6;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0;}
.hint{font-size:11.5px;color:var(--text-muted);line-height:1.8;}
.asset{
  display:flex;gap:9px;align-items:center;padding:8px;border:1px solid var(--border);
  border-radius:8px;margin-bottom:7px;background:var(--bg-panel-2);
}
.asset img{width:46px;height:46px;object-fit:cover;border-radius:5px;flex:0 0 auto;background:#333;}
.asset .a-body{flex:1 1 auto;min-width:0;}
.asset .a-name{font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.asset button{
  background:var(--bg-panel);border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:5px 9px;font-size:11.5px;cursor:pointer;margin-top:5px;
}
.asset button:hover{border-color:var(--accent);color:var(--accent);}
.badge{
  font-size:9.5px;padding:1px 5px;border-radius:4px;background:var(--accent-soft);
  color:var(--accent);flex:0 0 auto;
}

.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
  align-items:center;justify-content:center;z-index:1000;padding:16px;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;
  width:100%;max-width:560px;max-height:84vh;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.modal-head{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{margin:0;font-size:15px;font-weight:600;}
.modal-close{background:none;border:none;color:var(--text-muted);font-size:21px;cursor:pointer;line-height:1;}
.modal-body{padding:16px 18px;overflow-y:auto;}
.drop-zone{
  border:2px dashed var(--border);border-radius:10px;padding:26px 16px;text-align:center;
  color:var(--text-muted);font-size:12.5px;cursor:pointer;line-height:1.9;
}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent);color:var(--text);}
@media (max-width:960px){
  .rail{width:200px;} .inspector{width:230px;}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span><span>ブロック編集</span></div>
    <div class="topbar-actions">
      <button class="btn" id="btnImport">読み込む</button>
      <span class="tb-sep"></span>
      <button class="icon-btn" id="btnUndo" title="元に戻す (Ctrl+Z)"></button>
      <button class="icon-btn" id="btnRedo" title="やり直す (Ctrl+Shift+Z)"></button>
      <span class="tb-sep"></span>
      <span id="status"></span>
      <button class="btn" id="btnExport">ZIPで保存</button>
      <button class="btn btn-primary" id="btnPublish">公開する</button>
      <span class="tb-sep"></span>
      <a class="btn" href="./canvas.html" title="素材づくり用のキャンバスエディタへ">キャンバス</a>
      <span id="accountArea"></span>
    </div>
  </header>

  <div class="workspace">
    <aside class="rail">
      <div class="sec">
        <h4>ページ <span id="pageCount" class="badge">0</span></h4>
        <div id="pageList"></div>
        <div class="row2" style="margin-top:8px;">
          <button class="btn" id="btnAddPage" style="justify-content:center;">＋ 新規</button>
          <button class="btn" id="btnDupPage" style="justify-content:center;">このページを複製</button>
        </div>
      </div>
      <div class="sec">
        <h4>ブロック <span id="blockCount" class="badge">0</span></h4>
        <div id="blockList"></div>
      </div>
      <div class="sec">
        <h4>ページ情報</h4>
        <div class="field"><label>ページタイトル</label><input type="text" id="docTitle" placeholder="サイトのタイトル"></div>
        <div class="field" style="margin-bottom:0;"><label>説明文 (SEO)</label><textarea id="docDesc" placeholder="検索結果に出る説明"></textarea></div>
      </div>
      <div class="sec">
        <h4>サイトの色</h4>
        <div id="colorList"></div>
        <div class="hint" style="margin-top:8px;">色をクリックすると、その色をサイト全体で一括変更します。</div>
      </div>
      <div class="sec hint">
        <div>💡 プレビュー上の文字を直接クリックして書き換えられます</div>
        <div>💡 画像をクリックすると差し替えできます</div>
        <div>💡 ブロックはドラッグで並べ替えできます</div>
        <div>💡 投稿を増やすときは「このページを複製」</div>
      </div>
    </aside>

    <main class="stage-wrap">
      <div class="stage-bar">
        <div class="seg">
          <button data-w="pc" class="active">PC</button>
          <button data-w="tab">タブレット</button>
          <button data-w="sp">スマホ</button>
        </div>
      </div>
      <div id="stageHost">
        <iframe id="stage" sandbox="allow-same-origin"></iframe>
      </div>
    </main>

    <aside class="inspector" id="inspector"></aside>
  </div>
</div>

<input type="file" id="fileInput" accept=".html,.htm,.zip" hidden>
<input type="file" id="imgInput" accept="image/*" hidden>

<div class="modal-overlay" id="importModal">
  <div class="modal">
    <div class="modal-head"><h3>サイトを読み込む</h3><button class="modal-close" id="importClose">×</button></div>
    <div class="modal-body">
      <div class="drop-zone" id="dropZone">
        <strong>HTMLファイル / ZIPファイル</strong>をここにドロップ<br>
        またはクリックして選択<br>
        <span style="font-size:11px;">ZIP(HTML + CSS + 画像)だと見た目が完全に再現されます</span>
      </div>
      <hr class="sep">
      <div class="field">
        <label>HTMLを直接貼り付ける</label>
        <textarea id="pasteArea" style="min-height:150px;font-family:monospace;font-size:11.5px;" placeholder="&lt;!DOCTYPE html&gt; ... AIが生成したHTMLをここに貼り付け"></textarea>
      </div>
      <button class="btn btn-primary" id="btnPasteGo" style="width:100%;justify-content:center;">この内容で読み込む</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="publishModal">
  <div class="modal">
    <div class="modal-head"><h3>公開</h3><button class="modal-close" id="publishClose">×</button></div>
    <div class="modal-body" id="publishBody"></div>
  </div>
</div>

<script>
// ============================================================
// Block editor: edits AI-generated HTML in place.
//
// The document being edited lives as a real DOM in a sandboxed same-origin
// iframe. Sandboxing without allow-scripts means the site's own scripts never
// run while editing (so they cannot fight the editor), yet the parent can
// still reach contentDocument directly - no postMessage plumbing needed.
// ============================================================

const $ = (id)=>document.getElementById(id);
const svg = (b)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${b}</svg>`;
const ICONS = {
  undo: svg('<path d="M4 8h9.5a5.5 5.5 0 1 1 0 11H7"/><path d="M8 4 4 8l4 4"/>'),
  redo: svg('<path d="M20 8h-9.5a5.5 5.5 0 1 0 0 11H17"/><path d="m16 4 4 4-4 4"/>'),
  eye: svg('<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/>'),
  eyeOff: svg('<path d="M4 4.5 19.5 20"/><path d="M9.5 6.2A9.6 9.6 0 0 1 12 5.9c6.4 0 10 6.1 10 6.1a17 17 0 0 1-3.3 3.9"/><path d="M6.4 8.1A16.7 16.7 0 0 0 2 12s3.6 6.1 10 6.1a10 10 0 0 0 3.5-.6"/>'),
  grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>',
  hero: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/>'),
  text: svg('<path d="M5 6.5V5h14v1.5"/><path d="M12 5v14"/><path d="M9 19h6"/>'),
  image: svg('<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="m20.5 16.5-4.8-5-6.2 7.4"/>'),
  list: svg('<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>'),
  nav: svg('<path d="M4 7h16M4 12h16M4 17h16"/>'),
  foot: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15h18"/>'),
  pencil: svg('<path d="M4 20h4l10-10a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5 4 20Z"/>'),
  trash: svg('<path d="M4 7h16"/><path d="M9.5 7V5.5A1.5 1.5 0 0 1 11 4h2a1.5 1.5 0 0 1 1.5 1.5V7"/><path d="M6.5 7 7.4 19a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5L17.5 7"/>'),
  form: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6"/>'),
};

const state = {
  doc: null,          // live Document inside the iframe
  root: null,         // element whose children are the top-level blocks
  selected: null,     // data-blk id
  pages: [],          // {id,name,file,html} - html is the saved source per page
  currentPageId: null,
  assets: {},         // extra files from a ZIP (name -> dataURL) kept for export
  originalName: 'site',
  user: null,
  publishSlug: null,
  publishUrl: null,
};
const history = { stack: [], index: -1, limit: 60, muted: false };

// ---------- status ----------
let statusTimer = null;
function flash(msg, isErr){
  const el = $('status');
  el.textContent = msg;
  el.style.color = isErr ? '#e77' : 'var(--text-muted)';
  el.style.opacity = '1';
  clearTimeout(statusTimer);
  statusTimer = setTimeout(()=>{ el.style.opacity = '0'; }, 2600);
}

// ---------- history ----------
function snapshot(){
  return state.root ? state.root.innerHTML : '';
}
function historyReset(){
  history.stack = [snapshot()];
  history.index = 0;
  updateHistoryButtons();
}
function commit(){
  if(history.muted || !state.root) return;
  const s = snapshot();
  if(history.stack[history.index] === s) return;
  history.stack = history.stack.slice(0, history.index + 1);
  history.stack.push(s);
  if(history.stack.length > history.limit) history.stack.shift();
  history.index = history.stack.length - 1;
  updateHistoryButtons();
}
function applyHistory(){
  history.muted = true;
  state.root.innerHTML = history.stack[history.index];
  decorate();
  renderBlockList();
  renderInspector();
  history.muted = false;
  updateHistoryButtons();
}
function undo(){ if(history.index > 0){ history.index--; applyHistory(); flash('元に戻しました'); } }
function redo(){ if(history.index < history.stack.length-1){ history.index++; applyHistory(); flash('やり直しました'); } }
function updateHistoryButtons(){
  $('btnUndo').disabled = history.index <= 0;
  $('btnRedo').disabled = history.index >= history.stack.length - 1;
}

// ---------- import ----------
function parseHtml(text){
  return new DOMParser().parseFromString(text, 'text/html');
}

// The block row is the deepest single wrapper that actually holds several
// siblings - that is what a person thinks of as "the sections of the page".
function findBlockRoot(doc){
  let root = doc.querySelector('main') || doc.body;
  for(let depth = 0; depth < 6; depth++){
    const kids = elementChildren(root);
    if(kids.length === 1 && elementChildren(kids[0]).length > 1){ root = kids[0]; continue; }
    break;
  }
  return root;
}
function elementChildren(el){
  return [...el.children].filter(c=>!['SCRIPT','STYLE','LINK','TEMPLATE','NOSCRIPT'].includes(c.tagName));
}

function newId(){ return 'p' + Math.random().toString(36).slice(2,8); }

// Import replaces the whole project with a single page.
async function loadDocument(text, assets, name){
  const doc = parseHtml(text);
  if(!doc.body || !doc.body.children.length){
    flash('HTMLを読み取れませんでした', true);
    return;
  }
  state.assets = assets || {};
  state.originalName = name || 'site';

  // Inline the stylesheets that came with a ZIP so the preview matches.
  Object.keys(state.assets).forEach(fname=>{
    if(!/\.css$/i.test(fname)) return;
    const link = [...doc.querySelectorAll('link[rel=stylesheet]')]
      .find(l=>(l.getAttribute('href')||'').split('/').pop() === fname.split('/').pop());
    if(link){
      const st = doc.createElement('style');
      st.textContent = state.assets[fname];
      st.setAttribute('data-from', fname);
      link.replaceWith(st);
    }
  });
  // Point relative image sources at the bundled data URLs.
  doc.querySelectorAll('img[src]').forEach(img=>{
    const src = img.getAttribute('src') || '';
    if(/^(https?:|data:|\/)/i.test(src)) return;
    const hit = Object.keys(state.assets).find(f=>f.split('/').pop() === src.split('/').pop() && !/\.(css|js|html?)$/i.test(f));
    if(hit) img.setAttribute('src', state.assets[hit]);
  });

  const page = { id:newId(), name:'ホーム', file:'index.html', html:'<!DOCTYPE html>' + doc.documentElement.outerHTML };
  state.pages = [page];
  state.currentPageId = page.id;
  mountHtml(page.html);
}

// ---------- stage ----------
const EDITOR_CSS = `
[data-blk]{position:relative;}
[data-blk]:hover{outline:2px solid rgba(108,92,231,.55);outline-offset:-2px;cursor:pointer;}
[data-blk].blk-sel{outline:2px solid #6c5ce7;outline-offset:-2px;}
[data-blk][data-blk-off]{opacity:.3;}
[data-edit-text]:hover{background:rgba(108,92,231,.10);}
[data-edit-text]:focus{background:rgba(108,92,231,.14);outline:1px dashed #6c5ce7;}
img{cursor:pointer;}
`;

// Loads one page's source into the iframe and rebinds the editor to it.
function mountHtml(html){
  const frame = $('stage');
  frame.srcdoc = html;
  frame.onload = ()=>{
    const d = frame.contentDocument;
    if(!d) return;
    state.doc = d;
    state.root = findRootById(d);
    state.selected = null;
    if(!d.getElementById('__editor_css')){
      const st = d.createElement('style');
      st.id = '__editor_css';
      st.textContent = EDITOR_CSS;
      d.head.appendChild(st);
    }
    assignIds();
    decorate();
    syncHeadFields();
    renderPageList();
    renderBlockList();
    renderInspector();
    renderColors();
    historyReset();
  };
}
function assignIds(){
  let n = 1;
  elementChildren(state.root).forEach(el=>{
    if(!el.hasAttribute('data-blk')) el.setAttribute('data-blk', 'b' + (n++) + '-' + Math.random().toString(36).slice(2,7));
  });
}
function findRootById(d){
  let root = d.querySelector('main') || d.body;
  for(let depth = 0; depth < 6; depth++){
    const kids = elementChildren(root);
    if(kids.length === 1 && elementChildren(kids[0]).length > 1){ root = kids[0]; continue; }
    break;
  }
  return root;
}
function currentRaw(){
  return state.doc ? '<!DOCTYPE html>' + state.doc.documentElement.outerHTML : '';
}
function currentPage(){ return state.pages.find(p=>p.id===state.currentPageId) || null; }
function captureCurrent(){
  const p = currentPage();
  if(p && state.doc) p.html = currentRaw();
}
function syncHeadFields(){
  const t = state.doc.querySelector('title');
  $('docTitle').value = t ? t.textContent : '';
  const md = state.doc.querySelector('meta[name=description]');
  $('docDesc').value = md ? (md.getAttribute('content') || '') : '';
}

// ---------- pages ----------
function slugFile(name, taken){
  let base = String(name||'').trim().toLowerCase()
    .replace(/[^a-z0-9\- ]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')
    .slice(0,32);
  if(!base) base = 'page';
  let file = base + '.html', i = 2;
  while(taken.includes(file)){ file = base + '-' + (i++) + '.html'; }
  return file;
}
// A blank page keeps the site's shell (head, header, nav, footer) and drops
// the body sections, so a new page still looks like it belongs to the site.
function blankFromCurrent(raw){
  const d = parseHtml(raw);
  const root = findRootById(d);
  elementChildren(root).forEach(el=>{
    const tag = el.tagName.toLowerCase();
    const keep = tag==='header' || tag==='footer' || tag==='nav' || el.querySelector('nav');
    if(!keep) el.remove();
  });
  const t = d.querySelector('title');
  if(t) t.textContent = '新しいページ';
  return '<!DOCTYPE html>' + d.documentElement.outerHTML;
}
function addPage(mode){
  if(!state.pages.length){ flash('先にHTMLを読み込んでください', true); return; }
  captureCurrent();
  const label = mode==='dup' ? 'このページを複製して作る新しいページの名前' : '新しいページの名前';
  const name = prompt(label, mode==='dup' ? (currentPage().name + ' のコピー') : '新しいページ');
  if(name === null) return;
  const taken = state.pages.map(p=>p.file);
  const cur = currentPage();
  const html = mode==='dup' ? cur.html : blankFromCurrent(cur.html);
  const p = { id:newId(), name: name || '新しいページ', file: slugFile(name, taken), html };
  state.pages.push(p);
  state.currentPageId = p.id;
  mountHtml(p.html);
  flash('ページを追加しました: ' + p.file);
}
function switchPage(id){
  if(id === state.currentPageId) return;
  captureCurrent();
  const p = state.pages.find(x=>x.id===id);
  if(!p) return;
  state.currentPageId = id;
  mountHtml(p.html);
}
function renamePage(id){
  const p = state.pages.find(x=>x.id===id);
  if(!p) return;
  const name = prompt('ページ名', p.name);
  if(name === null) return;
  p.name = name || p.name;
  if(p.file !== 'index.html'){
    p.file = slugFile(p.name, state.pages.filter(x=>x!==p).map(x=>x.file));
  }
  renderPageList();
}
function deletePage(id){
  if(state.pages.length <= 1){ flash('最後の1ページは削除できません', true); return; }
  const p = state.pages.find(x=>x.id===id);
  if(!p) return;
  if(!confirm('ページ「' + p.name + '」を削除します。よろしいですか?')) return;
  const wasCurrent = id === state.currentPageId;
  state.pages = state.pages.filter(x=>x.id!==id);
  if(state.pages.length && state.pages[0].file !== 'index.html') state.pages[0].file = 'index.html';
  if(wasCurrent){
    state.currentPageId = state.pages[0].id;
    mountHtml(state.pages[0].html);
  } else {
    renderPageList();
  }
  flash('ページを削除しました');
}
function renderPageList(){
  const list = $('pageList');
  $('pageCount').textContent = state.pages.length;
  if(!state.pages.length){
    list.innerHTML = '<div class="empty" style="padding:14px 6px;">未読み込み</div>';
    return;
  }
  list.innerHTML = state.pages.map(p=>`
    <div class="pg-item ${p.id===state.currentPageId?'active':''}" data-page="${p.id}">
      <span class="pg-name" title="${escapeAttr(p.name)}">${escapeHtml(p.name)}</span>
      <span class="pg-file">${escapeHtml(p.file)}</span>
      <button class="blk-tog" data-renpg="${p.id}" title="名前を変更">${ICONS.pencil}</button>
      <button class="blk-tog" data-delpg="${p.id}" title="削除">${ICONS.trash}</button>
    </div>`).join('');
  list.querySelectorAll('.pg-item').forEach(n=>n.addEventListener('click', (e)=>{
    if(e.target.closest('button')) return;
    switchPage(n.dataset.page);
  }));
  list.querySelectorAll('[data-renpg]').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); renamePage(b.dataset.renpg); }));
  list.querySelectorAll('[data-delpg]').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); deletePage(b.dataset.delpg); }));
}

// Attach click/edit affordances to the live iframe DOM.
function decorate(){
  const d = state.doc;
  if(!d) return;
  elementChildren(state.root).forEach(el=>{
    if(!el.hasAttribute('data-blk')) el.setAttribute('data-blk','b'+Math.random().toString(36).slice(2,8));
    el.onclick = (e)=>{
      if(e.target.closest('[data-edit-text]') || e.target.tagName === 'IMG') return;
      e.preventDefault(); e.stopPropagation();
      selectBlock(el.getAttribute('data-blk'));
    };
    markEditable(el);
  });
  syncSelectionDom();
}

const TEXT_TAGS = ['H1','H2','H3','H4','H5','H6','P','LI','SPAN','A','TD','TH','BLOCKQUOTE','FIGCAPTION','BUTTON','LABEL','STRONG','EM','SMALL','DT','DD'];
function markEditable(blockEl){
  blockEl.querySelectorAll(TEXT_TAGS.join(',')).forEach(el=>{
    // Only leaves: an element whose children are all inline formatting.
    const hasBlockChild = [...el.children].some(c=>!['SPAN','A','STRONG','EM','B','I','SMALL','BR','CODE'].includes(c.tagName));
    if(hasBlockChild) return;
    if(!el.textContent.trim()) return;
    el.setAttribute('data-edit-text','1');
    el.setAttribute('contenteditable','true');
    el.onblur = ()=>{ commit(); renderBlockList(); };
    el.onkeydown = (e)=>{ if(e.key==='Escape') el.blur(); e.stopPropagation(); };
    el.onclick = (e)=>e.stopPropagation();
  });
  blockEl.querySelectorAll('img').forEach(img=>{
    img.onclick = (e)=>{
      e.preventDefault(); e.stopPropagation();
      selectBlock(blockEl.getAttribute('data-blk'));
      replaceImage(img);
    };
  });
}

// ---------- blocks ----------
function blocks(){ return state.root ? elementChildren(state.root) : []; }
function blockById(id){ return blocks().find(b=>b.getAttribute('data-blk')===id) || null; }

function blockLabel(el){
  const h = el.querySelector('h1,h2,h3,h4,h5,h6');
  if(h && h.textContent.trim()) return h.textContent.trim().replace(/\s+/g,' ').slice(0,26);
  const tag = el.tagName.toLowerCase();
  const named = { header:'ヘッダー', nav:'ナビゲーション', footer:'フッター', aside:'サイドバー', form:'フォーム' };
  if(named[tag]) return named[tag];
  const t = el.textContent.trim().replace(/\s+/g,' ');
  return t ? t.slice(0,26) : tag;
}
function blockIcon(el){
  const tag = el.tagName.toLowerCase();
  if(tag==='nav' || el.querySelector('nav')) return ICONS.nav;
  if(tag==='footer') return ICONS.foot;
  if(tag==='header') return ICONS.hero;
  if(el.querySelector('form,input,textarea')) return ICONS.form;
  if(el.querySelectorAll('img').length >= 2) return ICONS.image;
  if(el.querySelector('img')) return ICONS.image;
  if(el.querySelectorAll('li').length >= 2) return ICONS.list;
  return ICONS.text;
}

function renderBlockList(){
  const list = $('blockList');
  const bs = blocks();
  $('blockCount').textContent = bs.length;
  if(!bs.length){
    list.innerHTML = '<div class="empty">まだ何も読み込んでいません。<br>「読み込む」からHTMLを取り込んでください。</div>';
    return;
  }
  list.innerHTML = bs.map(el=>{
    const id = el.getAttribute('data-blk');
    const off = el.hasAttribute('data-blk-off');
    return `<div class="blk-item ${id===state.selected?'active':''} ${off?'is-hidden':''}" data-id="${id}" draggable="true">
      <span class="blk-ic">${blockIcon(el)}</span>
      <span class="blk-name">${escapeHtml(blockLabel(el))}</span>
      <button class="blk-tog" data-vis="${id}" title="${off?'表示する':'隠す'}">${off?ICONS.eyeOff:ICONS.eye}</button>
      <span class="grip">${ICONS.grip}</span>
    </div>`;
  }).join('');
  list.querySelectorAll('.blk-item').forEach(n=>{
    n.addEventListener('click', (e)=>{ if(e.target.closest('[data-vis]')) return; selectBlock(n.dataset.id); });
    attachDnd(n);
  });
  list.querySelectorAll('[data-vis]').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation(); toggleBlock(b.dataset.vis);
  }));
}

function selectBlock(id){
  state.selected = id;
  syncSelectionDom();
  renderBlockList();
  renderInspector();
  const el = blockById(id);
  if(el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth', block:'center'});
}
function syncSelectionDom(){
  blocks().forEach(el=>el.classList.toggle('blk-sel', el.getAttribute('data-blk')===state.selected));
}

function moveBlock(id, dir){
  const el = blockById(id);
  if(!el) return;
  if(dir < 0 && el.previousElementSibling) el.parentNode.insertBefore(el, el.previousElementSibling);
  else if(dir > 0 && el.nextElementSibling) el.parentNode.insertBefore(el.nextElementSibling, el);
  else return;
  commit(); renderBlockList(); renderInspector();
}
function duplicateBlock(id){
  const el = blockById(id);
  if(!el) return;
  const copy = el.cloneNode(true);
  copy.setAttribute('data-blk','b'+Math.random().toString(36).slice(2,8));
  copy.classList.remove('blk-sel');
  el.parentNode.insertBefore(copy, el.nextSibling);
  decorate();
  commit();
  selectBlock(copy.getAttribute('data-blk'));
  flash('ブロックを複製しました');
}
function deleteBlock(id){
  const el = blockById(id);
  if(!el) return;
  if(!confirm('「' + blockLabel(el) + '」を削除します。よろしいですか?')) return;
  el.remove();
  if(state.selected === id) state.selected = null;
  commit(); renderBlockList(); renderInspector();
  flash('ブロックを削除しました');
}
function toggleBlock(id){
  const el = blockById(id);
  if(!el) return;
  if(el.hasAttribute('data-blk-off')) el.removeAttribute('data-blk-off');
  else el.setAttribute('data-blk-off','1');
  commit(); renderBlockList(); renderInspector();
}

// drag & drop reorder
let dragId = null;
function clearMarks(){ $('blockList').querySelectorAll('.blk-item').forEach(n=>n.classList.remove('drop-before','drop-after')); }
function attachDnd(node){
  node.addEventListener('dragstart', (e)=>{
    dragId = node.dataset.id; node.classList.add('dragging');
    try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', dragId); }catch(err){}
  });
  node.addEventListener('dragend', ()=>{ node.classList.remove('dragging'); dragId=null; clearMarks(); });
  node.addEventListener('dragover', (e)=>{
    if(!dragId || node.dataset.id===dragId) return;
    e.preventDefault();
    const r = node.getBoundingClientRect();
    clearMarks();
    node.classList.add((e.clientY - r.top) > r.height/2 ? 'drop-after' : 'drop-before');
  });
  node.addEventListener('dragleave', ()=>node.classList.remove('drop-before','drop-after'));
  node.addEventListener('drop', (e)=>{
    e.preventDefault();
    if(!dragId || node.dataset.id===dragId){ clearMarks(); return; }
    const r = node.getBoundingClientRect();
    const after = (e.clientY - r.top) > r.height/2;
    clearMarks();
    const src = blockById(dragId), tgt = blockById(node.dataset.id);
    if(!src || !tgt) return;
    tgt.parentNode.insertBefore(src, after ? tgt.nextSibling : tgt);
    commit(); renderBlockList();
  });
}

// ---------- images ----------
let pendingImg = null;
let pendingBg = null;
function replaceImage(img){
  pendingImg = img;
  pendingBg = null;
  $('imgInput').click();
}
$('imgInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  $('imgInput').value = '';
  if(!file || (!pendingImg && !pendingBg)) return;
  flash('画像を処理中…');
  const dataUrl = await new Promise(res=>{ const r=new FileReader(); r.onload=ev=>res(ev.target.result); r.readAsDataURL(file); });
  let src = dataUrl;
  if(state.user){
    const up = await uploadImage(file);
    if(up) src = up;
  }
  if(pendingBg){
    pendingBg.style.backgroundImage = 'url("' + src + '")';
    if(!pendingBg.style.backgroundSize) pendingBg.style.backgroundSize = 'cover';
    if(!pendingBg.style.backgroundPosition) pendingBg.style.backgroundPosition = 'center';
    pendingBg = null;
    flash('背景画像を設定しました');
  } else {
    pendingImg.setAttribute('src', src);
    pendingImg.removeAttribute('srcset');
    pendingImg = null;
    flash('画像を差し替えました');
  }
  commit(); renderInspector();
});
async function uploadImage(file){
  try{
    const res = await fetch('/api/uploads', { method:'POST', credentials:'same-origin', headers:{'content-type':file.type}, body:file });
    if(!res.ok) return null;
    const j = await res.json();
    return j.url || null;
  }catch(err){ return null; }
}

// ---------- colours ----------
// Colours are read straight out of the document's own CSS text and inline
// styles, so a swap rewrites the author's stylesheet rather than piling
// overrides on top of it.
const COLOR_RE = /#[0-9a-fA-F]{3}\b|#[0-9a-fA-F]{6}\b|rgba?\([^)]*\)/g;
let colorIndex = {};

function normColor(lit){
  lit = lit.trim();
  if(lit[0] === '#'){
    let h = lit.slice(1).toLowerCase();
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    return '#' + h;
  }
  const m = lit.match(/rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/i);
  if(!m) return null;
  const hex = (n)=>Math.max(0,Math.min(255,Math.round(Number(n)))).toString(16).padStart(2,'0');
  return '#' + hex(m[1]) + hex(m[2]) + hex(m[3]);
}
function styleCarriers(){
  const out = [];
  state.doc.querySelectorAll('style').forEach(el=>out.push({
    get:()=>el.textContent, set:(v)=>{ el.textContent = v; }
  }));
  state.doc.querySelectorAll('[style]').forEach(el=>out.push({
    get:()=>el.getAttribute('style') || '', set:(v)=>el.setAttribute('style', v)
  }));
  return out;
}
function collectColors(){
  colorIndex = {};
  if(!state.doc) return [];
  styleCarriers().forEach(c=>{
    (c.get().match(COLOR_RE) || []).forEach(lit=>{
      const n = normColor(lit);
      if(!n) return;
      if(!colorIndex[n]) colorIndex[n] = { count:0, forms:new Set() };
      colorIndex[n].count++;
      colorIndex[n].forms.add(lit.trim());
    });
  });
  return Object.keys(colorIndex)
    .sort((a,b)=>colorIndex[b].count - colorIndex[a].count)
    .slice(0, 16);
}
function replaceColorEverywhere(norm, to){
  const entry = colorIndex[norm];
  if(!entry) return;
  // Longest first so #ffffff is handled before #fff, and never let a short hex
  // eat the front of a longer one.
  const forms = [...entry.forms].sort((a,b)=>b.length-a.length);
  styleCarriers().forEach(c=>{
    let text = c.get();
    forms.forEach(lit=>{
      const re = lit[0]==='#'
        ? new RegExp(lit.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '(?![0-9a-fA-F])', 'g')
        : new RegExp(lit.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g');
      text = text.replace(re, to);
    });
    c.set(text);
  });
  commit();
  renderColors();
  flash(norm + ' を ' + to + ' に変更しました');
}
function renderColors(){
  const host = $('colorList');
  if(!host) return;
  const list = collectColors();
  if(!list.length){ host.innerHTML = '<div class="hint">色が見つかりません。</div>'; return; }
  host.innerHTML = list.map(c=>
    `<button class="sw" data-color="${c}" style="background:${c}" title="${c}（${colorIndex[c].count}箇所）"><span>${colorIndex[c].count}</span></button>`
  ).join('');
  host.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click', ()=>{
    const from = b.dataset.color;
    const input = document.createElement('input');
    input.type = 'color';
    input.value = from;
    input.style.cssText = 'position:fixed;left:-9999px;';
    document.body.appendChild(input);
    input.addEventListener('change', ()=>{
      if(input.value.toLowerCase() !== from) replaceColorEverywhere(from, input.value.toLowerCase());
      input.remove();
    });
    input.click();
  }));
}

// ---------- block styling ----------
function computedOf(el){
  const win = state.doc.defaultView;
  return win ? win.getComputedStyle(el) : null;
}
function rgbToHex(v){
  const n = normColor(v || '');
  return n || '#ffffff';
}
function bgImageUrl(el){
  const cs = computedOf(el);
  const bi = cs ? cs.backgroundImage : '';
  const m = (bi || '').match(/url\((['"]?)(.*?)\1\)/);
  return m ? m[2] : '';
}

// ---------- inspector ----------
function renderInspector(){
  const insp = $('inspector');
  const el = state.selected ? blockById(state.selected) : null;
  if(!el){
    insp.innerHTML = blocks().length
      ? '<div class="empty">ブロックを選ぶと、その中の画像やリンクをまとめて編集できます。<br><br>プレビュー上の文字は直接クリックして書き換えられます。</div>'
      : '<div class="empty">HTMLを読み込むと、ここに編集項目が表示されます。</div>';
    return;
  }
  const off = el.hasAttribute('data-blk-off');
  const imgs = [...el.querySelectorAll('img')];
  const links = [...el.querySelectorAll('a[href]')];

  let html = `<div style="font-weight:600;font-size:13.5px;margin-bottom:4px;">${escapeHtml(blockLabel(el))}</div>
    <div class="hint" style="margin-bottom:12px;">&lt;${el.tagName.toLowerCase()}&gt; ${off?'・非表示':''}</div>
    <div class="row2">
      <button class="btn" data-op="up">↑ 上へ</button>
      <button class="btn" data-op="down">↓ 下へ</button>
    </div>
    <div class="row2" style="margin-top:7px;">
      <button class="btn" data-op="dup">複製</button>
      <button class="btn" data-op="del">削除</button>
    </div>
    <button class="btn" data-op="vis" style="width:100%;justify-content:center;margin-top:7px;">${off?'表示に戻す':'このブロックを隠す'}</button>
    <hr class="sep">`;

  const cs = computedOf(el);
  const bgUrl = bgImageUrl(el);
  html += `<div class="field"><label>このブロックの見た目</label>
    <div class="row2">
      <div>
        <div class="hint" style="margin-bottom:4px;">背景色</div>
        <input type="color" id="blkBg" value="${rgbToHex(cs?cs.backgroundColor:'')}" style="width:100%;height:30px;padding:2px;background:var(--bg-panel-2);border:1px solid var(--border);border-radius:6px;">
      </div>
      <div>
        <div class="hint" style="margin-bottom:4px;">文字色</div>
        <input type="color" id="blkFg" value="${rgbToHex(cs?cs.color:'')}" style="width:100%;height:30px;padding:2px;background:var(--bg-panel-2);border:1px solid var(--border);border-radius:6px;">
      </div>
    </div>
    <div class="row2" style="margin-top:7px;">
      <button class="btn" data-op="bgimg" style="justify-content:center;">${bgUrl?'背景画像を変更':'背景画像を設定'}</button>
      <button class="btn" data-op="bgclear" style="justify-content:center;" ${bgUrl?'':'disabled'}>背景画像を外す</button>
    </div>
  </div>
  <hr class="sep">`;

  html += `<div class="field"><label>画像 (${imgs.length})</label>`;
  html += imgs.length ? imgs.map((im,i)=>`
    <div class="asset">
      <img src="${escapeAttr(im.getAttribute('src')||'')}" alt="">
      <div class="a-body">
        <div class="a-name">${escapeHtml((im.getAttribute('alt')||'画像 '+(i+1)))}</div>
        <button data-img="${i}">差し替える</button>
      </div>
    </div>`).join('') : '<div class="hint">このブロックに画像はありません。</div>';
  html += '</div>';

  html += `<div class="field"><label>リンク (${links.length})</label>`;
  html += links.length ? links.map((a,i)=>`
    <div style="margin-bottom:8px;">
      <div class="a-name" style="margin-bottom:4px;">${escapeHtml(a.textContent.trim().slice(0,26) || 'リンク '+(i+1))}</div>
      <input type="text" data-link="${i}" value="${escapeAttr(a.getAttribute('href')||'')}">
    </div>`).join('') : '<div class="hint">このブロックにリンクはありません。</div>';
  html += '</div>';

  insp.innerHTML = html;
  insp.querySelectorAll('[data-op]').forEach(b=>b.addEventListener('click', ()=>{
    const op = b.dataset.op;
    if(op==='up') moveBlock(state.selected,-1);
    else if(op==='down') moveBlock(state.selected,1);
    else if(op==='dup') duplicateBlock(state.selected);
    else if(op==='del') deleteBlock(state.selected);
    else if(op==='vis') toggleBlock(state.selected);
    else if(op==='bgimg'){ pendingBg = el; $('imgInput').click(); }
    else if(op==='bgclear'){ el.style.backgroundImage = 'none'; commit(); renderInspector(); }
  }));
  const bindColor = (id, prop)=>{
    const n = document.getElementById(id);
    if(!n) return;
    n.addEventListener('input', ()=>{ el.style[prop] = n.value; });
    n.addEventListener('change', ()=>{ commit(); renderColors(); });
  };
  bindColor('blkBg','backgroundColor');
  bindColor('blkFg','color');

  insp.querySelectorAll('[data-img]').forEach(b=>b.addEventListener('click', ()=>replaceImage(imgs[Number(b.dataset.img)])));
  insp.querySelectorAll('[data-link]').forEach(inp=>{
    inp.addEventListener('change', ()=>{ links[Number(inp.dataset.link)].setAttribute('href', inp.value); commit(); });
  });
}

// ---------- serialize ----------
// Produces the clean document: editor attributes gone, hidden blocks dropped,
// the author's own CSS and scripts untouched.
function cleanHtml(raw){
  const d = parseHtml(raw);
  d.querySelectorAll('[data-blk-off]').forEach(n=>n.remove());
  d.querySelectorAll('[data-blk]').forEach(n=>{
    n.removeAttribute('data-blk');
    n.classList.remove('blk-sel');
    if(!n.getAttribute('class')) n.removeAttribute('class');
  });
  d.querySelectorAll('[data-edit-text]').forEach(n=>{
    n.removeAttribute('data-edit-text');
    n.removeAttribute('contenteditable');
  });
  const css = d.getElementById('__editor_css');
  if(css) css.remove();
  return '<!DOCTYPE html>\n' + d.documentElement.outerHTML;
}
// Every page, cleaned, keyed by output file name.
function allPageFiles(){
  captureCurrent();
  const files = {};
  state.pages.forEach(p=>{ files[p.file] = cleanHtml(p.html); });
  return files;
}
function serialize(){ return cleanHtml(currentRaw()); }

// ---------- export ----------
$('btnExport').addEventListener('click', async ()=>{
  if(!state.doc){ flash('先にHTMLを読み込んでください', true); return; }
  if(typeof JSZip === 'undefined'){ flash('JSZipの読み込みに失敗しました', true); return; }
  const zip = new JSZip();
  const files = allPageFiles();
  Object.keys(files).forEach(name=>zip.file(name, files[name]));
  Object.keys(state.assets).forEach(name=>{
    if(/\.css$/i.test(name)) return;              // already inlined
    const v = state.assets[name];
    if(typeof v === 'string' && v.startsWith('data:')) zip.file(name, v.split(',')[1], {base64:true});
  });
  const blob = await zip.generateAsync({type:'blob'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = state.originalName + '-edited.zip';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  flash(Object.keys(files).length + 'ページをZIPに保存しました');
});

$('btnPublish').addEventListener('click', async ()=>{
  if(!state.doc){ flash('先にHTMLを読み込んでください', true); return; }
  if(!state.user){
    if(confirm('公開にはログインが必要です。ログインしますか?')) location.href='/api/auth/login';
    return;
  }
  $('publishModal').classList.add('open');
  $('publishBody').innerHTML = '<div class="empty">公開状況を確認中…</div>';
  try{
    const r = await fetch('/api/publish', { credentials:'same-origin' });
    const j = await r.json();
    const mine = (j.sites||[]).find(s=>s.slug === state.publishSlug);
    if(mine){ state.publishSlug = mine.slug; state.publishUrl = location.origin + '/s/' + mine.slug + '/'; }
    renderPublish();
  }catch(err){ renderPublish(); }
});
function renderPublish(){
  $('publishBody').innerHTML = `
    <div class="field"><label>サイト名</label><input type="text" id="pubTitle" value="${escapeAttr($('docTitle').value || 'マイサイト')}"></div>
    ${state.publishUrl ? `<div class="field"><label>公開URL(同じURLを更新します)</label><input type="text" value="${escapeAttr(state.publishUrl)}" readonly></div>` : ''}
    <button class="btn btn-primary" id="pubGo" style="width:100%;justify-content:center;">${state.publishUrl?'更新して公開':'公開する'}</button>`;
  $('pubGo').addEventListener('click', doPublish);
}
async function doPublish(){
  $('publishBody').innerHTML = '<div class="empty">公開中…</div>';
  try{
    const res = await fetch('/api/publish', {
      method:'POST', credentials:'same-origin', headers:{'content-type':'application/json'},
      body: JSON.stringify({
        title: $('docTitle').value || 'マイサイト',
        slug: state.publishSlug || undefined,
        files: allPageFiles(),
      }),
    });
    const j = await res.json().catch(()=>({}));
    if(!res.ok){ $('publishBody').innerHTML = `<div class="empty" style="color:#e77;">${escapeHtml(j.message||'公開に失敗しました')}</div>`; return; }
    state.publishSlug = j.slug; state.publishUrl = j.url;
    $('publishBody').innerHTML = `
      <div class="empty" style="color:var(--text);">公開しました 🎉</div>
      <div class="field"><label>公開URL</label><input type="text" id="pubUrl" value="${escapeAttr(j.url)}" readonly></div>
      <div class="row2">
        <button class="btn" id="pubCopy">URLをコピー</button>
        <button class="btn" id="pubOpen">開く</button>
      </div>`;
    $('pubCopy').addEventListener('click', async ()=>{ try{ await navigator.clipboard.writeText(j.url); flash('コピーしました'); }catch(e){ $('pubUrl').select(); } });
    $('pubOpen').addEventListener('click', ()=>window.open(j.url,'_blank','noopener'));
    flash('公開しました');
  }catch(err){
    $('publishBody').innerHTML = '<div class="empty" style="color:#e77;">公開に失敗しました。</div>';
  }
}

async function handleFile(file){
  const name = file.name.replace(/\.[^.]+$/,'');
  if(/\.zip$/i.test(file.name)){
    if(typeof JSZip === 'undefined'){ flash('JSZipの読み込みに失敗しました', true); return; }
    const zip = await JSZip.loadAsync(file);
    const names = Object.keys(zip.files).filter(n=>!zip.files[n].dir);
    const htmlName = names.find(n=>/(^|\/)index\.html?$/i.test(n)) || names.find(n=>/\.html?$/i.test(n));
    if(!htmlName){ flash('ZIPの中にHTMLが見つかりません', true); return; }
    const assets = {};
    for(const n of names){
      if(n === htmlName) continue;
      if(/\.(css)$/i.test(n)) assets[n] = await zip.file(n).async('string');
      else if(/\.(png|jpe?g|gif|webp|svg|avif)$/i.test(n)){
        const b64 = await zip.file(n).async('base64');
        const mime = /\.svg$/i.test(n) ? 'image/svg+xml' : ('image/' + n.split('.').pop().toLowerCase().replace('jpg','jpeg'));
        assets[n] = 'data:' + mime + ';base64,' + b64;
      }
    }
    const text = await zip.file(htmlName).async('string');
    $('importModal').classList.remove('open');
    loadDocument(text, assets, name);
  } else {
    const text = await file.text();
    $('importModal').classList.remove('open');
    loadDocument(text, {}, name);
  }
}

function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escapeAttr(s){ return escapeHtml(s); }
